# CircleCI — build the 4 CPN Engage images and push them to GHCR.
#
# Runs on a git tag like v1.2.0 (and on main → the "edge" tag). The images ship
# only compiled output (no source). Clients pull them from GHCR by tag.
#
# Required project env vars (Project Settings → Environment Variables):
#   GHCR_USER   your GitHub username/org that owns the packages (e.g. heyharii)
#   GHCR_TOKEN  a GitHub PAT (classic) with the `write:packages` scope
#
version: 2.1

jobs:
  build-and-push:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Resolve image tag
          command: |
            # Tag build → use the git tag; branch build → "edge".
            if [ -n "${CIRCLE_TAG:-}" ]; then
              echo "export IMG_TAG=${CIRCLE_TAG}" >> "$BASH_ENV"
            else
              echo "export IMG_TAG=edge" >> "$BASH_ENV"
            fi
            echo "export REG=ghcr.io/${GHCR_USER:-local}" >> "$BASH_ENV"
      # Build FIRST — this validates the source-hiding Dockerfiles with no creds.
      - run:
          name: Build images
          command: |
            set -eux
            docker build -f services/api/Dockerfile               -t "$REG/cpn-engage-api:$IMG_TAG"   .
            docker build -f services/notification-bot/Dockerfile  -t "$REG/cpn-engage-bot:$IMG_TAG"   .
            docker build -f apps/employee-app/Dockerfile          -t "$REG/cpn-engage-home:$IMG_TAG"  .
            docker build -f apps/admin-console/Dockerfile         -t "$REG/cpn-engage-admin:$IMG_TAG" .
      # Smoke test — the API image must boot and answer /health (no DB needed for that).
      - run:
          name: Smoke test the API image
          command: |
            set -eux
            docker run -d --name apitest -e PORT=4175 "$REG/cpn-engage-api:$IMG_TAG"
            # Wait for the server to log that it's listening (boot can be slow on CI).
            for i in $(seq 1 40); do
              docker logs apitest 2>&1 | grep -q "Server listening" && break
              sleep 1
            done
            ok=""
            for i in $(seq 1 15); do
              if docker exec apitest wget -qO- http://localhost:4175/health 2>/dev/null | grep -q '"ok":true'; then
                ok=1; echo "API image boots + /health OK"; break
              fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "=== API boot logs ==="; docker logs apitest || true
              docker rm -f apitest; exit 1
            fi
            # Prove the shipped image has NO TypeScript source of ours.
            test -z "$(docker exec apitest sh -c 'find /app/services /app/packages -name "*.ts" 2>/dev/null')" \
              && echo "confirmed: no .ts source in the image"
            docker rm -f apitest
      - run:
          name: Log in to GHCR
          command: |
            if [ -z "${GHCR_TOKEN:-}" ]; then echo "GHCR_TOKEN not set — skipping push"; circleci-agent step halt; fi
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - run:
          name: Tag :latest on release tags
          command: |
            set -eux
            if [ -n "${CIRCLE_TAG:-}" ]; then
              for s in api bot home admin; do
                docker tag "$REG/cpn-engage-$s:$IMG_TAG" "$REG/cpn-engage-$s:latest"
              done
            fi
      - run:
          name: Push images
          command: |
            set -eux
            for s in api bot home admin; do
              docker push "$REG/cpn-engage-$s:$IMG_TAG"
            done
            if [ -n "${CIRCLE_TAG:-}" ]; then
              for s in api bot home admin; do
                docker push "$REG/cpn-engage-$s:latest"
              done
            fi

workflows:
  publish:
    jobs:
      - build-and-push:
          filters:
            tags:
              only: /^v.*/
            branches:
              only: main
