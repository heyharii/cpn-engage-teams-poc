services:
  - type: web
    name: cpn-engage-api-teams-poc
    runtime: node
    repo: https://github.com/heyharii/cpn-engage-teams-poc
    branch: main
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @cpn-engage/api build
    startCommand: pnpm --filter @cpn-engage/api start
    healthCheckPath: /readyz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_KEY
        sync: false
      - key: PUSH_TOKEN
        sync: false
      - key: ALLOW_GUEST
        # Demo fallback for browser previews; a verified Teams SSO token still wins.
        value: "true"
      - key: ALLOWED_ORIGINS
        value: https://cpn-engage-home-teams-poc.onrender.com,https://cpn-engage-community-teams-poc.onrender.com,https://cpn-engage-feed-teams-poc.onrender.com,https://cpn-engage-admin-teams-poc.onrender.com
      - key: NOTIFICATION_BOT_URL
        value: https://cpn-engage-bot-teams-poc.onrender.com
      # Teams SSO token validation for the personal Profile tab.
      - key: TEAMS_APP_ID
        value: 4cf4e885-f429-406d-84a0-3e0af5aad1ad
      - key: TEAMS_APP_TENANT_ID
        value: 699dfad7-3096-44ab-86ae-d98e637f1f94
      - key: APPLICATION_ID_URI
        value: api://cpn-engage-home-teams-poc.onrender.com/4cf4e885-f429-406d-84a0-3e0af5aad1ad
      # Shared Postgres — per-user scoring + leaderboard (same DB as the bot).
      - key: DATABASE_URL
        fromDatabase:
          name: cpn-engage-db
          property: connectionString

  - type: web
    name: cpn-engage-bot-teams-poc
    runtime: node
    repo: https://github.com/heyharii/cpn-engage-teams-poc
    branch: main
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @cpn-engage/notification-bot build
    startCommand: pnpm --filter @cpn-engage/notification-bot start
    healthCheckPath: /health
    envVars:
      - key: API_BASE_URL
        value: https://cpn-engage-api-teams-poc.onrender.com
      # Postgres for proactive messaging (conversation refs). On-prem later: just
      # point DATABASE_URL at the on-prem Postgres.
      - key: DATABASE_URL
        fromDatabase:
          name: cpn-engage-db
          property: connectionString
      - key: ADMIN_KEY
        sync: false
      # Tenant strategy + secrets — set in the Render dashboard, never committed.
      # (SingleTenant or MultiTenant depending on the app registration.)
      - key: TEAMS_APP_TYPE
        sync: false
      - key: TEAMS_APP_ID
        sync: false
      - key: TEAMS_APP_PASSWORD
        sync: false
      - key: TEAMS_APP_TENANT_ID
        sync: false
      # Teams package id used by Graph app-catalog lookup for proactive installs.
      - key: TEAMS_MANIFEST_APP_ID
        value: 11e326e7-3dfe-49ac-9202-1857b18d6383
      # Optional shared secret to protect the proactive push endpoint.
      - key: PUSH_TOKEN
        sync: false
      - key: ADMIN_ORIGIN
        value: https://cpn-engage-admin-teams-poc.onrender.com

  - type: web
    name: cpn-engage-home-teams-poc
    runtime: static
    repo: https://github.com/heyharii/cpn-engage-teams-poc
    branch: main
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @cpn-engage/employee-app build
    staticPublishPath: apps/employee-app/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://cpn-engage-api-teams-poc.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: cpn-engage-admin-teams-poc
    runtime: static
    repo: https://github.com/heyharii/cpn-engage-teams-poc
    branch: main
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @cpn-engage/admin-console build
    staticPublishPath: apps/admin-console/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://cpn-engage-api-teams-poc.onrender.com
      - key: VITE_BOT_BASE_URL
        value: https://cpn-engage-bot-teams-poc.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: cpn-engage-feed-teams-poc
    runtime: static
    repo: https://github.com/heyharii/cpn-engage-teams-poc
    branch: main
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @cpn-engage/community-feed build
    staticPublishPath: apps/community-feed/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://cpn-engage-api-teams-poc.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: cpn-engage-db
    plan: free
    databaseName: cpn_engage
    user: cpn_engage
