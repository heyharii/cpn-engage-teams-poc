services:
  - type: web
    name: cpn-engage-api-teams-poc
    runtime: node
    repo: https://github.com/heyharii/cpn-engage-teams-poc
    branch: main
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @cpn-engage/api build
    startCommand: pnpm --filter @cpn-engage/api start
    healthCheckPath: /health
    envVars:
      - key: NOTIFICATION_BOT_URL
        value: https://cpn-engage-bot-teams-poc.onrender.com
      # Teams SSO token validation for the personal Profile tab.
      - key: TEAMS_APP_ID
        sync: false
      - key: TEAMS_APP_TENANT_ID
        sync: false
      - key: APPLICATION_ID_URI
        sync: false
      # Shared Postgres — per-user scoring + leaderboard (same DB as the bot).
      - key: DATABASE_URL
        fromDatabase:
          name: cpn-engage-db
          property: connectionString

  - type: web
    name: cpn-engage-bot-teams-poc
    runtime: node
    repo: https://github.com/heyharii/cpn-engage-teams-poc
    branch: main
    plan: starter
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @cpn-engage/notification-bot build
    startCommand: pnpm --filter @cpn-engage/notification-bot start
    healthCheckPath: /health
    envVars:
      - key: API_BASE_URL
        value: https://cpn-engage-api-teams-poc.onrender.com
      # Postgres for proactive messaging (conversation refs). On-prem later: just
      # point DATABASE_URL at the on-prem Postgres.
      - key: DATABASE_URL
        fromDatabase:
          name: cpn-engage-db
          property: connectionString
      # Tenant strategy + secrets — set in the Render dashboard, never committed.
      # (SingleTenant or MultiTenant depending on the app registration.)
      - key: TEAMS_APP_TYPE
        sync: false
      - key: TEAMS_APP_ID
        sync: false
      - key: TEAMS_APP_PASSWORD
        sync: false
      - key: TEAMS_APP_TENANT_ID
        sync: false
      # Optional shared secret to protect the proactive push endpoint.
      - key: PUSH_TOKEN
        sync: false
      - key: ADMIN_ORIGIN
        value: https://cpn-engage-admin-teams-poc.onrender.com

  - type: web
    name: cpn-engage-home-teams-poc
    runtime: static
    repo: https://github.com/heyharii/cpn-engage-teams-poc
    branch: main
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @cpn-engage/employee-app build
    staticPublishPath: apps/employee-app/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://cpn-engage-api-teams-poc.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: cpn-engage-admin-teams-poc
    runtime: static
    repo: https://github.com/heyharii/cpn-engage-teams-poc
    branch: main
    buildCommand: pnpm install --frozen-lockfile && pnpm --filter @cpn-engage/admin-console build
    staticPublishPath: apps/admin-console/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://cpn-engage-api-teams-poc.onrender.com
      - key: VITE_BOT_BASE_URL
        value: https://cpn-engage-bot-teams-poc.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: cpn-engage-db
    plan: free
    databaseName: cpn_engage
    user: cpn_engage
