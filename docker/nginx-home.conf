# Employee app (Profile + Feeds tabs). Serves the SPA and reverse-proxies the
# API on the SAME origin, so the built app uses relative /api/* paths — the one
# image works at any client hostname without a rebuild (and avoids CORS).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=30s;  # docker embedded DNS (lazy upstream resolution)

    location /api/ {
        set $api "http://api:4175";
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Authorization $http_authorization;
    }

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
