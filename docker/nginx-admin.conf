# Admin console. Serves the SPA and reverse-proxies BOTH the API (/api/*) and
# the bot ops endpoints (/internal/*) on the same origin, so the built app uses
# relative paths — one image, any client hostname, no rebuild, no CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    resolver 127.0.0.11 valid=30s;

    location /api/ {
        set $api "http://api:4175";
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header x-admin-key $http_x_admin_key;
        proxy_set_header Authorization $http_authorization;
    }

    location /internal/ {
        set $bot "http://bot:4177";
        proxy_pass $bot;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header x-admin-key $http_x_admin_key;
    }

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
