# SPA static hosting — every path (including client-router routes like
# /feeds) falls back to index.html, matching the `rewrite /* -> /index.html`
# rule used on Render for these same static sites.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }
}
